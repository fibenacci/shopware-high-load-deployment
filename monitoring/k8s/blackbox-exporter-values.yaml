# prometheus-blackbox-exporter — external-perspective probes.
#
# Cluster-internal scrapes (ServiceMonitor on the app pods) can't tell
# the difference between "the app is up" and "the app is up but DNS to
# the public domain is broken / cert expired / CDN is timing out".
# Blackbox does that.
#
# Install:
#   helm install blackbox-exporter prometheus-community/prometheus-blackbox-exporter \
#       -n observability -f monitoring/k8s/blackbox-exporter-values.yaml

config:
    modules:
        # HTTP 2xx + cert expiry. Used for storefront + admin probes.
        http_2xx:
            prober: http
            timeout: 10s
            http:
                method: GET
                follow_redirects: true
                preferred_ip_protocol: ip4
                fail_if_ssl: false
                fail_if_not_ssl: true
                fail_if_body_not_matches_regexp: []
                valid_status_codes: [200, 301, 302]
                valid_http_versions: ["HTTP/1.1", "HTTP/2"]
                tls_config:
                    insecure_skip_verify: false

        # Storefront-specific probe — checks for a marker that proves the
        # kernel actually responded (not just a CDN-cached error page).
        shopware_storefront:
            prober: http
            timeout: 10s
            http:
                method: GET
                follow_redirects: true
                preferred_ip_protocol: ip4
                fail_if_not_ssl: true
                fail_if_body_not_matches_regexp:
                    - 'data-shopware-app'
                valid_status_codes: [200]

        # Store-API context — confirms the JSON layer is responsive.
        shopware_store_api:
            prober: http
            timeout: 10s
            http:
                method: GET
                preferred_ip_protocol: ip4
                fail_if_not_ssl: true
                valid_status_codes: [200, 401]   # 401 = no access-token, but service is up
                headers:
                    sw-access-key: "${SW_ACCESS_KEY}"

        # TCP probe — used to detect when the public LB / CDN drops below
        # serving level even before HTTP fails.
        tcp_connect:
            prober: tcp
            timeout: 5s

        # DNS — probes the resolver from the cluster outwards. Catches
        # rare-but-painful misconfigurations.
        dns_external:
            prober: dns
            timeout: 5s
            dns:
                query_name: shop.example.com
                query_type: A

serviceMonitor:
    enabled: true
    defaults:
        labels: { release: kube-prometheus-stack }
        interval: 30s
        scrapeTimeout: 10s
    # The actual probe targets — Helm renders these into a Probe CR.
    targets:
        - name: storefront-https
          url: https://shop.example.com
          module: shopware_storefront
        - name: admin-login
          url: https://shop.example.com/admin
          module: http_2xx
        - name: store-api-context
          url: https://shop.example.com/store-api/context
          module: shopware_store_api
        - name: www-redirect
          url: https://www.shop.example.com
          module: http_2xx

prometheusRule:
    enabled: true
    additionalLabels: { release: kube-prometheus-stack }
    rules:
        - alert: ShopwareExternalProbeDown
          expr: probe_success{job=~".*blackbox.*"} == 0
          for: 3m
          labels: { severity: critical }
          annotations:
              summary: "External probe failing: {{ $labels.instance }}"
              description: "Blackbox probe to {{ $labels.instance }} (module {{ $labels.module }}) has been failing for 3+ minutes."

        - alert: ShopwareTLSCertExpiringSoon
          expr: probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
          for: 1h
          labels: { severity: warning }
          annotations:
              summary: "TLS cert expires in < 14 days for {{ $labels.instance }}"

        - alert: ShopwareTLSCertExpiringCritical
          expr: probe_ssl_earliest_cert_expiry - time() < 3 * 24 * 3600
          for: 30m
          labels: { severity: critical }
          annotations:
              summary: "TLS cert expires in < 3 days for {{ $labels.instance }} — cert-manager broken?"

        - alert: ShopwareSlowExternalResponse
          expr: probe_duration_seconds > 5
          for: 10m
          labels: { severity: warning }
          annotations:
              summary: "External probe slow ({{ $value }}s > 5s) for {{ $labels.instance }}"
