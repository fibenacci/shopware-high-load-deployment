apiVersion: v1
kind: ConfigMap
metadata:
    name: shopware-stresstest-script
    namespace: shopware-staging
data:
    loadtest.js: |
        // NOTE: kustomize/CI replace this with `--from-file=loadtest.js`
        // from k3s/stresstest/k6/loadtest.js. Apply via:
        //   kubectl -n shopware-staging create cm shopware-stresstest-script \
        //     --from-file=loadtest.js=k3s/stresstest/k6/loadtest.js \
        //     --dry-run=client -o yaml | kubectl apply -f -

---
apiVersion: batch/v1
kind: Job
metadata:
    name: shopware-stresstest
    namespace: shopware-staging
    labels:
        app.kubernetes.io/name: shopware-stresstest
spec:
    ttlSecondsAfterFinished: 1800
    backoffLimit: 0
    template:
        metadata:
            labels:
                app.kubernetes.io/name: shopware-stresstest
        spec:
            restartPolicy: Never
            containers:
                - name: k6
                  image: grafana/k6:0.51.0
                  args:
                      - run
                      - --out
                      - experimental-prometheus-rw
                      - --tag
                      - testid=$(K6_PROFILE)
                      - /scripts/loadtest.js
                  env:
                      - name: K6_PROFILE
                        value: baseline
                      - name: BASE_URL
                        value: http://shopware-web.shopware-staging.svc.cluster.local
                      - name: K6_PROMETHEUS_RW_SERVER_URL
                        value: http://kube-prometheus-stack-prometheus.observability:9090/api/v1/write
                      - name: K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM
                        value: "true"
                  resources:
                      requests: { cpu: 500m, memory: 512Mi }
                      limits:   { cpu: 2,    memory: 2Gi }
                  volumeMounts:
                      - { name: script, mountPath: /scripts }
            volumes:
                - name: script
                  configMap:
                      name: shopware-stresstest-script
