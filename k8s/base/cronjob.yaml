apiVersion: batch/v1
kind: CronJob
metadata:
    name: shopware-scheduled-task
    labels:
        app.kubernetes.io/name: shopware
        app.kubernetes.io/component: cron
spec:
    schedule: "*/5 * * * *"
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    startingDeadlineSeconds: 120
    jobTemplate:
        spec:
            backoffLimit: 1
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 600
            template:
                spec:
                    restartPolicy: Never
                    containers:
                        - name: cron
                          image: ghcr.io/EXAMPLE/shopware:latest
                          args: ["cron"]
                          envFrom:
                              - configMapRef: { name: shopware-config }
                              - secretRef:    { name: shopware-secrets }
                          resources:
                              requests: { cpu: 50m, memory: 256Mi }
                              limits:   { cpu: 500m, memory: 512Mi }
