# Varnish edge cache — sits between the Ingress and the shopware-web Service.
# Enabled by toggling the Ingress backend to point at `shopware-varnish` in the
# overlay. Disabled in the base (which routes Ingress → shopware-web directly).
#
# Image: ghcr.io/shopware/varnish-shopware:latest — Shopware's official image,
# ships the canonical VCL + xkey module for surrogate-key invalidation.
#   https://github.com/shopware/varnish-shopware
#   https://developer.shopware.com/docs/guides/hosting/infrastructure/reverse-http-cache.html
#
# If you need a custom VCL (plugin-specific routes etc.), swap this image
# for one built from docker/varnish/Dockerfile.

apiVersion: apps/v1
kind: Deployment
metadata:
    name: shopware-varnish
    labels:
        app.kubernetes.io/name: shopware
        app.kubernetes.io/component: varnish
spec:
    replicas: 2
    revisionHistoryLimit: 5
    strategy:
        type: RollingUpdate
        rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
    selector:
        matchLabels:
            app.kubernetes.io/name: shopware
            app.kubernetes.io/component: varnish
    template:
        metadata:
            labels:
                app.kubernetes.io/name: shopware
                app.kubernetes.io/component: varnish
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "9131"
        spec:
            terminationGracePeriodSeconds: 30
            containers:
                - name: varnish
                  image: ghcr.io/shopware/varnish-shopware:latest
                  ports:
                      - { containerPort: 80, name: http }
                  env:
                      # The official Shopware image consumes these env vars.
                      # See https://github.com/shopware/varnish-shopware
                      - { name: BACKEND_HOST,   value: shopware-web }
                      - { name: BACKEND_PORT,   value: "80" }
                      - { name: VARNISH_SIZE,   value: "1g" }
                      - { name: CACHE_GRACE,    value: "1d" }
                      - { name: CACHE_TTL,      value: "7200" }
                  resources:
                      requests: { cpu: 100m, memory: 1.2Gi }
                      limits:   { cpu: 1,    memory: 1.5Gi }
                  readinessProbe:
                      httpGet: { path: /health, port: http }
                      initialDelaySeconds: 5
                      periodSeconds: 5
                  livenessProbe:
                      httpGet: { path: /health, port: http }
                      initialDelaySeconds: 15
                      periodSeconds: 15

                # Prometheus metrics exporter — exposes hit rate, backend
                # health, eviction count for the Grafana dashboard.
                - name: exporter
                  image: jonnenauha/prometheus_varnish_exporter:1.6.1
                  args: ["-varnish.params=-n,/var/lib/varnish/$(POD_NAME)"]
                  env:
                      - name: POD_NAME
                        valueFrom: { fieldRef: { fieldPath: metadata.name } }
                  ports:
                      - { containerPort: 9131, name: metrics }
                  resources:
                      requests: { cpu: 10m, memory: 32Mi }
                      limits:   { cpu: 100m, memory: 64Mi }

---
apiVersion: v1
kind: Service
metadata:
    name: shopware-varnish
    labels:
        app.kubernetes.io/name: shopware
        app.kubernetes.io/component: varnish
spec:
    selector:
        app.kubernetes.io/name: shopware
        app.kubernetes.io/component: varnish
    ports:
        - { name: http,    port: 80,   targetPort: 80 }
        - { name: metrics, port: 9131, targetPort: 9131 }

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
    name: shopware-varnish
spec:
    minAvailable: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: shopware
            app.kubernetes.io/component: varnish
