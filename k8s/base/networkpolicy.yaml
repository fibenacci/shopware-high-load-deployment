# Deny-by-default + explicit allowances. Adopt only after you've verified
# every cross-namespace dependency (observability scrape, ingress controller,
# external secrets manager) is explicitly allowed.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: default-deny
spec:
    podSelector: {}
    policyTypes: [Ingress, Egress]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: allow-ingress-to-web
spec:
    podSelector:
        matchLabels: { app.kubernetes.io/component: web }
    policyTypes: [Ingress]
    ingress:
        - from:
              - namespaceSelector:
                    matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
              - namespaceSelector:
                    matchLabels: { kubernetes.io/metadata.name: observability }
          ports:
              - { port: 8080, protocol: TCP }
              - { port: 9253, protocol: TCP }

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: allow-internal-egress
spec:
    podSelector:
        matchLabels: { app.kubernetes.io/part-of: shopware }
    policyTypes: [Egress]
    egress:
        # DNS
        - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
          ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
        # Stateful services in this namespace
        - to: [{ podSelector: {} }]
        # Observability collectors
        - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } } }]
        # Outbound HTTPS (composer.shopware.com, mail providers, payment, ...)
        - ports: [{ port: 443, protocol: TCP }, { port: 587, protocol: TCP }]
