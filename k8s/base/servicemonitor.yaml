apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: shopware-web
    labels:
        # kube-prometheus-stack picks these up by default — adjust if your
        # Prometheus uses a different selector.
        release: kube-prometheus-stack
spec:
    selector:
        matchLabels:
            app.kubernetes.io/name: shopware
            app.kubernetes.io/component: web
    endpoints:
        - port: metrics
          interval: 15s
          path: /metrics
