# Single-node — fine for staging. For real prod swap in the OpenSearch
# Operator (or your cloud provider's managed offering).

apiVersion: v1
kind: Service
metadata: { name: opensearch }
spec:
    selector: { app.kubernetes.io/component: opensearch }
    ports: [{ port: 9200, targetPort: 9200 }]

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: opensearch
    labels:
        app.kubernetes.io/component: opensearch
spec:
    serviceName: opensearch
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/component: opensearch
    template:
        metadata:
            labels:
                app.kubernetes.io/component: opensearch
                app.kubernetes.io/part-of: shopware
        spec:
            initContainers:
                - name: vm-max-map
                  image: busybox
                  command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
                  securityContext: { privileged: true, runAsUser: 0 }
            containers:
                - name: opensearch
                  image: opensearchproject/opensearch:2
                  env:
                      - { name: discovery.type, value: single-node }
                      - { name: plugins.security.disabled, value: "true" }
                      - { name: OPENSEARCH_INITIAL_ADMIN_PASSWORD, value: "Admin123!Strong" }
                      - { name: OPENSEARCH_JAVA_OPTS, value: "-Xms1g -Xmx1g" }
                  ports: [{ containerPort: 9200 }]
                  volumeMounts: [{ name: data, mountPath: /usr/share/opensearch/data }]
                  resources:
                      requests: { cpu: 250m, memory: 1.5Gi }
                      limits:   { cpu: 2,    memory: 3Gi }
                  readinessProbe:
                      httpGet: { path: /, port: 9200 }
                      initialDelaySeconds: 30
                      periodSeconds: 10
    volumeClaimTemplates:
        - metadata: { name: data }
          spec:
              accessModes: ["ReadWriteOnce"]
              resources: { requests: { storage: 20Gi } }
