apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: shopware-web
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: shopware-web
    minReplicas: 2
    maxReplicas: 10
    metrics:
        - type: Resource
          resource:
              name: cpu
              target: { type: Utilization, averageUtilization: 70 }
        - type: Resource
          resource:
              name: memory
              target: { type: Utilization, averageUtilization: 80 }
        # Add a php_fpm_active_processes metric here once the exporter is wired
        # into a Prometheus Adapter — better signal than CPU for FPM-bound load.
    behavior:
        scaleUp:
            stabilizationWindowSeconds: 30
            policies:
                - { type: Pods,    value: 2,  periodSeconds: 30 }
                - { type: Percent, value: 50, periodSeconds: 30 }
            selectPolicy: Max
        scaleDown:
            stabilizationWindowSeconds: 300
            policies:
                - { type: Pods,    value: 1,  periodSeconds: 60 }
                - { type: Percent, value: 20, periodSeconds: 60 }
            selectPolicy: Min
