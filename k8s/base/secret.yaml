# Placeholder Secret — REPLACE every value before going to prod. In real use
# this should be generated by External Secrets / Vault / Sealed Secrets, not
# committed in plaintext.
apiVersion: v1
kind: Secret
metadata:
    name: shopware-secrets
type: Opaque
stringData:
    APP_SECRET: "CHANGEME_LONG_RANDOM"
    DATABASE_URL: "mysql://shopware:shopware@mariadb:3306/shopware"
    MYSQL_ROOT_PASSWORD: "CHANGEME_ROOT"
    MYSQL_PASSWORD: "CHANGEME"
    REDIS_CACHE_PASSWORD: "CHANGEME"
    REDIS_SESSION_PASSWORD: "CHANGEME"
    REDIS_DSN: "redis://:CHANGEME@redis:6379"
    RABBITMQ_DEFAULT_USER: "shopware"
    RABBITMQ_DEFAULT_PASS: "CHANGEME"
    # Shopware install admin password (used on fresh install only).
    INSTALL_ADMIN_PASSWORD: "CHANGEME"

    # Shopware Store credentials — required for paid plugins. Leave empty
    # if your shop only uses open-source extensions.
    SHOPWARE_STORE_ACCOUNT_EMAIL: ""
    SHOPWARE_STORE_ACCOUNT_PASSWORD: ""
    SHOPWARE_STORE_LICENSE_DOMAIN: ""

    # Optional — opt-in APM
    TIDEWAYS_APIKEY: ""
