apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
    selector: { app.kubernetes.io/component: redis }
    ports: [{ port: 6379, targetPort: 6379 }]

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: redis
    labels:
        app.kubernetes.io/component: redis
spec:
    serviceName: redis
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/component: redis
    template:
        metadata:
            labels:
                app.kubernetes.io/component: redis
                app.kubernetes.io/part-of: shopware
        spec:
            containers:
                - name: redis
                  image: redis:7-alpine
                  command:
                      - sh
                      - -c
                      - exec redis-server --requirepass "$REDIS_CACHE_PASSWORD" --maxmemory 1gb --maxmemory-policy allkeys-lru
                  envFrom:
                      - secretRef: { name: shopware-secrets }
                  ports: [{ containerPort: 6379 }]
                  volumeMounts: [{ name: data, mountPath: /data }]
                  resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits:   { cpu: 1,    memory: 1.5Gi }
                  readinessProbe:
                      exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_CACHE_PASSWORD\" ping | grep -q PONG"] }
    volumeClaimTemplates:
        - metadata: { name: data }
          spec:
              accessModes: ["ReadWriteOnce"]
              resources: { requests: { storage: 10Gi } }
