apiVersion: apps/v1
kind: Deployment
metadata:
    name: shopware-worker
    labels:
        app.kubernetes.io/name: shopware
        app.kubernetes.io/component: worker
spec:
    replicas: 2
    revisionHistoryLimit: 5
    strategy:
        type: RollingUpdate
    selector:
        matchLabels:
            app.kubernetes.io/name: shopware
            app.kubernetes.io/component: worker
    template:
        metadata:
            labels:
                app.kubernetes.io/name: shopware
                app.kubernetes.io/component: worker
        spec:
            terminationGracePeriodSeconds: 90
            containers:
                - name: worker
                  image: ghcr.io/EXAMPLE/shopware-worker:latest
                  args: ["worker"]
                  envFrom:
                      - configMapRef: { name: shopware-config }
                      - secretRef:    { name: shopware-secrets }
                  env:
                      - name: MESSENGER_QUEUES
                        value: "async low_priority failed"
                      - name: MESSENGER_TIME_LIMIT
                        value: "3600"
                      - name: MESSENGER_MEMORY_LIMIT
                        value: "512M"
                      - name: RUN_MIGRATIONS
                        value: "0"
                  resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits:   { cpu: 1000m, memory: 768Mi }
                  livenessProbe:
                      exec:
                          command:
                              - sh
                              - -c
                              - "test -f /tmp/.worker-alive || pgrep -f messenger:consume"
                      initialDelaySeconds: 30
                      periodSeconds: 30
                  volumeMounts:
                      - { name: var-tmp,   mountPath: /tmp }
                      - { name: var-cache, mountPath: /var/www/html/var/cache }
                      - { name: var-log,   mountPath: /var/www/html/var/log }
                      - { name: media,     mountPath: /var/www/html/public/media }
                      - { name: thumbnail, mountPath: /var/www/html/public/thumbnail }
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities: { drop: ["ALL"] }
            volumes:
                - { name: var-tmp,   emptyDir: {} }
                - { name: var-cache, emptyDir: {} }
                - { name: var-log,   emptyDir: {} }
                - { name: media,     emptyDir: {} }
                - { name: thumbnail, emptyDir: {} }
