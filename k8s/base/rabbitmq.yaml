apiVersion: v1
kind: Service
metadata: { name: rabbitmq }
spec:
    selector: { app.kubernetes.io/component: rabbitmq }
    ports:
        - { name: amqp, port: 5672, targetPort: 5672 }
        - { name: mgmt, port: 15672, targetPort: 15672 }

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: rabbitmq
    labels:
        app.kubernetes.io/component: rabbitmq
spec:
    serviceName: rabbitmq
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/component: rabbitmq
    template:
        metadata:
            labels:
                app.kubernetes.io/component: rabbitmq
                app.kubernetes.io/part-of: shopware
        spec:
            containers:
                - name: rabbitmq
                  image: rabbitmq:4-management
                  envFrom:
                      - secretRef: { name: shopware-secrets }
                  ports:
                      - { containerPort: 5672, name: amqp }
                      - { containerPort: 15672, name: mgmt }
                  volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
                  resources:
                      requests: { cpu: 100m, memory: 512Mi }
                      limits:   { cpu: 2,    memory: 1.5Gi }
                  readinessProbe:
                      exec: { command: ["rabbitmq-diagnostics", "check_running"] }
                      initialDelaySeconds: 20
                      periodSeconds: 10
    volumeClaimTemplates:
        - metadata: { name: data }
          spec:
              accessModes: ["ReadWriteOnce"]
              resources: { requests: { storage: 10Gi } }
