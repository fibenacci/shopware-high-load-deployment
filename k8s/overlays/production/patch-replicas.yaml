apiVersion: apps/v1
kind: Deployment
metadata:
    name: shopware-web
spec:
    replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: shopware-worker
spec:
    replicas: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: shopware-web
spec:
    minReplicas: 3
    maxReplicas: 20
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
    name: shopware-web
spec:
    minAvailable: 2
