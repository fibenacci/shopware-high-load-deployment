[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

; Dynamic process management — tuned for a k8s pod with a single container.
; In k8s we scale horizontally, so a small per-pod worker pool keeps memory
; budgets predictable.
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE}
pm.max_requests = 500

; Status endpoint — scraped by the prometheus php-fpm exporter sidecar.
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

request_terminate_timeout = 300s
