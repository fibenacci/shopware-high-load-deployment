# =============================================================================
# Local development stack for the Shopware shop template.
#
# Pattern intentionally kept close to a "real" prod topology so the dev/prod
# parity stays high — one process per container, dedicated networks, named
# volumes for state. The Dockware image is used here only for fast onboarding;
# the production-grade build context lives in docker/Dockerfile (php-fpm +
# nginx, multi-stage, used by k8s).
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-shopware-shop}

services:
    mariadb:
        image: mariadb:10.11
        container_name: ${COMPOSE_PROJECT_NAME:-shopware-shop}-mariadb
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${MYSQL_DATABASE:-shopware}
            MYSQL_USER: ${MYSQL_USER:-shopware}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shopware}
        command: --max_allowed_packet=1073741824 --innodb_buffer_pool_size=1G
        volumes:
            - mariadb_data:/var/lib/mysql
        ports:
            - '3306'
        networks:
            shop:
                aliases:
                    - db.${PROJECT_DOMAIN:-shop.docker}
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}', '--silent']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    opensearch:
        image: opensearchproject/opensearch:2
        container_name: ${COMPOSE_PROJECT_NAME:-shopware-shop}-opensearch
        environment:
            - discovery.type=single-node
            - plugins.security.disabled=true
            - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-Admin123!Strong}
            - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
            - VIRTUAL_HOST=opensearch.${PROJECT_DOMAIN:-shop.docker}
            - VIRTUAL_PORT=9200
        volumes:
            - opensearch_data:/usr/share/opensearch/data
        ports:
            - '9200'
        networks:
            shop:
                aliases:
                    - opensearch.${PROJECT_DOMAIN:-shop.docker}
            proxy:

    opensearch-dashboards:
        image: opensearchproject/opensearch-dashboards:2
        container_name: ${COMPOSE_PROJECT_NAME:-shopware-shop}-opensearch-dashboards
        environment:
            - OPENSEARCH_HOSTS=http://opensearch:9200
            - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
            - VIRTUAL_HOST=opensearch-dashboards.${PROJECT_DOMAIN:-shop.docker}
            - VIRTUAL_PORT=5601
        networks: [shop, proxy]
        depends_on:
            - opensearch

    redis:
        image: redis:7-alpine
        container_name: ${COMPOSE_PROJECT_NAME:-shopware-shop}-redis
        command: ['sh', '-c', 'exec redis-server --requirepass "${REDIS_CACHE_PASSWORD:-redis}"']
        volumes:
            - redis_data:/data
        ports:
            - '6379'
        networks:
            shop:
                aliases:
                    - redis.${PROJECT_DOMAIN:-shop.docker}
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "${REDIS_CACHE_PASSWORD:-redis}" ping | grep -q PONG']
            interval: 5s
            timeout: 5s
            retries: 5

    redis-commander:
        image: rediscommander/redis-commander:latest
        container_name: ${COMPOSE_PROJECT_NAME:-shopware-shop}-redis-commander
        environment:
            - REDIS_HOSTS=local:redis:6379:0:${REDIS_CACHE_PASSWORD:-redis}
            - VIRTUAL_HOST=redis.${PROJECT_DOMAIN:-shop.docker}
            - VIRTUAL_PORT=8081
        networks: [shop, proxy]
        depends_on:
            - redis

    rabbitmq:
        image: rabbitmq:4-management
        container_name: ${COMPOSE_PROJECT_NAME:-shopware-shop}-rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shopware}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shopware}
            RABBITMQ_DEFAULT_VHOST: /
            VIRTUAL_HOST: rabbitmq.${PROJECT_DOMAIN:-shop.docker}
            VIRTUAL_PORT: '15672'
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        ports:
            - '5672'
            - '15672'
        networks:
            shop:
                aliases:
                    - rabbitmq.${PROJECT_DOMAIN:-shop.docker}
            proxy:
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', 'check_running']
            interval: 5s
            timeout: 5s
            retries: 5

    mailpit:
        image: axllent/mailpit:latest
        container_name: ${COMPOSE_PROJECT_NAME:-shopware-shop}-mailpit
        environment:
            - VIRTUAL_HOST=mail.${PROJECT_DOMAIN:-shop.docker}
            - VIRTUAL_PORT=8025
        networks: [shop, proxy]

    app:
        # Dev image — fast onboarding. Switch to your prod image (build context
        # at ./docker, target stage `dev`) once you outgrow Dockware.
        image: ${DOCKWARE_IMAGE:-dockware/dev}:${DOCKWARE_TAG:-${SHOPWARE_VERSION:-6.6.5.1}}
        container_name: ${COMPOSE_PROJECT_NAME:-shopware-shop}-app
        env_file:
            - .env.local
        environment:
            - XDEBUG_ENABLED=1
            - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-root}@mariadb:3306/${MYSQL_DATABASE:-shopware}
        depends_on:
            mariadb: { condition: service_healthy }
            opensearch: { condition: service_started }
            redis: { condition: service_healthy }
            rabbitmq: { condition: service_healthy }
        healthcheck:
            test: ['CMD', 'php', '-v']
            interval: 5s
            timeout: 5s
            retries: 24
            start_period: 30s
        volumes:
            # Additive mounts only — files Dockware's image does NOT ship.
            # We deliberately do NOT bind-mount ./public, ./src, ./config,
            # ./composer.json or ./composer.lock — those would mask Dockware's
            # pre-installed Shopware skeleton and require running through the
            # whole `composer create-project shopware/production` dance just
            # to boot. If you need to customise framework files, see
            # `make scaffold-shop` + the compose.override.yaml.example.
            - ./.build:/var/www/html/.build
            - ./custom:/var/www/html/custom
            - ./.env.local:/var/www/html/.env.local
            - ./auth.json:/var/www/html/auth.json
            - ./sales-channel-hosts.local.map:/var/www/html/sales-channel-hosts.local.map
            - ./docker/scripts/entrypoint-dev.sh:/setup-custom.sh
            - ./docker/scripts/apply-sales-channel-domains.sh:/apply-sales-channel-domains.sh
            # Per-file overrides into config/packages/ — we layer ours on top
            # of Dockware's bundle-registering bundles.php without masking it.
            - ./config/packages/shopware.yaml:/var/www/html/config/packages/shopware.yaml:ro
            - ./config/packages/staging.yaml:/var/www/html/config/packages/staging.yaml:ro
        networks:
            shop:
                aliases:
                    - app.${PROJECT_DOMAIN:-shop.docker}
            proxy:

    worker:
        image: ${DOCKWARE_IMAGE:-dockware/dev}:${DOCKWARE_TAG:-${SHOPWARE_VERSION:-6.6.5.1}}
        container_name: ${COMPOSE_PROJECT_NAME:-shopware-shop}-worker
        env_file:
            - .env.local
        depends_on:
            app: { condition: service_healthy }
        volumes:
            # Same additive policy as `app` — see comment above.
            - ./custom:/var/www/html/custom
            - ./config/packages/shopware.yaml:/var/www/html/config/packages/shopware.yaml:ro
            - ./config/packages/staging.yaml:/var/www/html/config/packages/staging.yaml:ro
        command:
            - sh
            - -c
            - |
              while true; do
                bin/console messenger:consume async low_priority failed \
                  --time-limit=300 --memory-limit=256M -v || sleep 5;
              done
        networks: [shop]

    ingress:
        image: nginx:alpine
        container_name: ${COMPOSE_PROJECT_NAME:-shopware-shop}-ingress
        depends_on:
            app: { condition: service_healthy }
        environment:
            # PROJECT_DOMAIN MUST be in the container env — the entrypoint
            # below uses `envsubst $$PROJECT_DOMAIN` to render the nginx
            # config from the .template. Without this, envsubst replaces
            # ${PROJECT_DOMAIN} with empty string, nginx fails to load,
            # the container exits, and Dinghy serves its landing page
            # because no backend claims VIRTUAL_HOST=shop.docker.
            - PROJECT_DOMAIN=${PROJECT_DOMAIN:-shop.docker}
            - VIRTUAL_HOST=${PROJECT_DOMAIN:-shop.docker},*.${PROJECT_DOMAIN:-shop.docker},adminer.${PROJECT_DOMAIN:-shop.docker}
        volumes:
            - ./docker/nginx/ingress.conf.template:/etc/nginx/templates/default.conf.template:ro
        command: ['/bin/sh', '-c', "envsubst '$$PROJECT_DOMAIN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
        networks:
            shop:
                aliases:
                    - ingress.${PROJECT_DOMAIN:-shop.docker}
            proxy:

volumes:
    mariadb_data:
    opensearch_data:
    redis_data:
    rabbitmq_data:

networks:
    shop:
        driver: bridge
    proxy:
        external: true
